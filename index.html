<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>O Que Eu Faço Agora?</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        .caixa {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 0 30px #000;
        }

        h1 {
            font-size: 32px;
        }

        #resposta {
            font-size: 22px;
            margin: 30px 0;
            min-height: 50px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="caixa">

    <h1>O que eu faço agora?</h1>

    <div id="resposta">
        Clique no botão para descobrir seu destino.
    </div>

    <button onclick="decidir()">DECIDIR POR MIM</button>

</div>

<script>

const respostas = [
    "Levante e olhe pela janela.",
    "Abra a geladeira. Não pegue nada.",
    "Faça um desenho completamente inútil.",
    "Conte quantas coisas existem na sua mesa.",
    "Crie um jogo que ninguém pediu.",
    "Tome água.",
    "Fique olhando para o teto por 30 segundos.",
    "Pesquise por que os pinguins não voam.",
    "Organize uma pasta do computador que você ignora há meses.",
    "Clique no botão novamente. Você não tem escolha.",
    "Desligue o computador... ou não.",
    "Vá procurar alguma coisa que você perdeu.",
    "Crie uma teoria da conspiração sobre seu mouse.",
    "Faça absolutamente nada por 1 minuto."
];

function decidir() {

    const numero = Math.floor(Math.random() * respostas.length);

    document.getElementById("resposta").innerText = respostas[numero];

}

</script>

</body>
</html>
